<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="t d">
<title id="t">How LumoAuth protects an MCP server</title>
<desc id="d">An MCP client calls your server without a token and gets a 401 that says where to sign in. The user signs in through LumoAuth, which issues a token for this server only. The client calls the tool again with the token. Your server checks the token and runs the tool.</desc>
<rect x="1" y="1" width="878" height="378" rx="14" fill="#0A0A0B" stroke="#3A3A40" stroke-width="1.5"/>
<line x1="130" y1="86" x2="130" y2="352" stroke="#3A3A40" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="38" y="22" width="184" height="62" rx="12" fill="#161618" stroke="#3A3A40" stroke-width="1.5"/>
<text x="130" y="50" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">MCP client</text>
<text x="130" y="71" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#A1A1AA">Claude Code, your agent</text>
<line x1="440" y1="86" x2="440" y2="352" stroke="#3A3A40" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="348" y="22" width="184" height="62" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="440" y="50" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#0A0A0B">Your server</text>
<text x="440" y="71" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0A0A0B" opacity="0.78">with this package</text>
<line x1="750" y1="86" x2="750" y2="352" stroke="#3A3A40" stroke-width="1.5" stroke-dasharray="3 5"/>
<rect x="658" y="22" width="184" height="62" rx="12" fill="#161618" stroke="#3A3A40" stroke-width="1.5"/>
<text x="750" y="50" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">LumoAuth</text>
<text x="750" y="71" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#A1A1AA">your organization</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 9 5 0 9.2Z" fill="#FFFFFF"/></marker></defs>
<line x1="140" y1="122" x2="436" y2="122" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#a)"/>
<text x="285.0" y="113" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#FFFFFF" stroke="#0A0A0B" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Calls a tool, no token</text>
<circle cx="130" cy="122" r="11" fill="#FFFFFF"/>
<text x="130" y="126.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0A0B">1</text>
<line x1="430" y1="166" x2="134" y2="166" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#a)"/>
<text x="285.0" y="157" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#FFFFFF" stroke="#0A0A0B" stroke-width="6" stroke-linejoin="round" paint-order="stroke">401 and where to sign in</text>
<circle cx="440" cy="166" r="11" fill="#FFFFFF"/>
<text x="440" y="170.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0A0B">2</text>
<line x1="140" y1="210" x2="746" y2="210" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#a)"/>
<text x="440.0" y="201" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#FFFFFF" stroke="#0A0A0B" stroke-width="6" stroke-linejoin="round" paint-order="stroke">The user signs in and approves</text>
<circle cx="130" cy="210" r="11" fill="#FFFFFF"/>
<text x="130" y="214.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0A0B">3</text>
<line x1="740" y1="254" x2="134" y2="254" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#a)"/>
<text x="440.0" y="245" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#FFFFFF" stroke="#0A0A0B" stroke-width="6" stroke-linejoin="round" paint-order="stroke">A token for this server only</text>
<circle cx="750" cy="254" r="11" fill="#FFFFFF"/>
<text x="750" y="258.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0A0B">4</text>
<line x1="140" y1="298" x2="436" y2="298" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#a)"/>
<text x="285.0" y="289" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#FFFFFF" stroke="#0A0A0B" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Calls the tool with the token</text>
<circle cx="130" cy="298" r="11" fill="#FFFFFF"/>
<text x="130" y="302.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0A0B">5</text>
<rect x="310" y="316" width="260" height="38" rx="10" fill="#161618" stroke="#3A3A40" stroke-width="1.5"/>
<circle cx="332" cy="335" r="11" fill="#FFFFFF"/>
<text x="332" y="339.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0A0A0B">6</text>
<text x="452" y="340.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#FFFFFF">Checks it, runs the tool</text>
</svg>
